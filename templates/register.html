<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: url("{{ url_for('static', filename='log.png.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        .reg-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 80px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            width: 400px;
            backdrop-filter: blur(8px);
        }

        h1, h2 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: #000000;
            margin-bottom: 20px;
        }

        input {
            display: block;
            margin: 10px auto;
            width: 85%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        #name, #pass, #email {
            background: rgba(255, 255, 255, 0.8);
        }

        button {
            width: 90%;
            padding: 12px;
            border: none;
            background: linear-gradient(45deg, #00c6ff, #0072ff,#000000);
            color: rgb(0, 0, 0);
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(45deg, #0072ff, #00c6ff);
        }

        p {
            margin-top: 15px;
            color: #ffffff;
        }

        p a {
            color: #000000;
            text-decoration: none;
            font-weight: bold;
        }

        p a:hover {
            text-decoration: underline;
            color: #1efff4;
        }

        /* Flash messages (Flask) */
        .flashes {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
        }

        .flashes li {
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>Register</h2>
        <form method="POST">
            <input type="text" id="name" name="username" placeholder="Username" required><br><br>
            <input type="email" id="email" name="email" placeholder="Email" required><br><br>
            <input type="password" id="pass" name="password" placeholder="Password" required><br><br>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</body>
</html>
